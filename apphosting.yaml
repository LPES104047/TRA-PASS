# Firebase App Hosting 設定檔
# 這個檔案用於設定伺服器的硬體資源與限制

runConfig:
  # 【安全煞車防護】
  # 限制最大執行個體（伺服器）數量為 1。
  # 即使網站遇到瞬間爆增的龐大流量，系統最多也只會開啟 1 台伺服器來處理。
  # 超出的流量會需要排隊等待，但絕對不會自動開啟更多伺服器來扣您的信用卡款項，
  # 確保您能穩穩待在免費額度與 Google One 的 $10 美元抵免範圍內。
  maxInstances: 1
  
  # 最小執行個體數：設為 0 代表如果沒人看您的網站，伺服器會完全休眠，節省成本 (會有冷啟動問題但最省錢)
  minInstances: 0
